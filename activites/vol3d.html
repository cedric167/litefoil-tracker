<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Lite Foil : vol en 3D</title>
<!-- 23/11/2026 : replay d'un vol sur « 3D Maps » de Google (Maps JavaScript API, bibliothèque maps3d).
     La clé est dans ../gmaps-key.js. Si Google refuse ou si l'appareil ne suit pas, on bascule sur vol3d-c.html (globe satellite sans relief). -->
<script src="../gmaps-key.js"></script>
<style>
  html, body { margin:0; height:100%; background:#0b0d10; color:#fff; font:15px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
  #map { position:absolute; inset:0; } #map gmp-map-3d { width:100%; height:100%; display:block; }
  #pin { position:absolute; left:50%; top:50%; z-index:4; display:none; flex-direction:column; align-items:center; pointer-events:none; transform:translate(-50%,-100%) translateY(-34px); }
  #pin b { margin-bottom:5px; padding:3px 10px; border-radius:12px; background:rgba(10,14,18,.76); color:#fff; font-size:12.5px; font-weight:700; white-space:nowrap; max-width:170px; overflow:hidden; text-overflow:ellipsis; box-shadow:0 4px 10px rgba(0,0,0,.4); } #pin b:empty { display:none; }
  #pin span { width:54px; height:54px; border-radius:50%; border:3px solid #fff; overflow:hidden; background:#0fb9cf; box-shadow:0 0 0 3px #ff2d8f, 0 0 20px rgba(255,45,143,.6), 0 8px 16px rgba(0,0,0,.45); } #pin span img { width:100%; height:100%; object-fit:cover; display:block; }
  #pin i { width:3px; height:26px; background:linear-gradient(#fff,#ff2d8f 70%,rgba(255,45,143,.2)); border-radius:2px; }
  #dot { position:absolute; left:50%; top:50%; z-index:3; width:18px; height:18px; margin:-13px 0 0 -13px; border-radius:50%; background:#ff2d8f; border:4px solid #fff; box-shadow:0 0 14px rgba(255,45,143,.8); pointer-events:none; display:none; }
  .top { position:absolute; left:0; right:0; top:0; padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 26px; text-align:center; pointer-events:none; z-index:5;
         background:linear-gradient(rgba(6,10,14,.72), rgba(6,10,14,0)); }
  .top b { display:block; font-size:12px; letter-spacing:.28em; } .top b i { font-style:normal; color:#19e3ff; }
  .top > span { display:block; font-size:14px; color:#d6e3ea; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .st { display:flex; justify-content:space-around; margin-top:8px; }
  .st div { font-size:10.5px; letter-spacing:.08em; color:#b9c8cf; text-transform:uppercase; }
  .st div strong { display:block; font-size:25px; letter-spacing:0; color:#fff; text-transform:none; font-variant-numeric:tabular-nums; }
  .st small { font-size:12px; font-weight:600; color:#d6e3ea; }
  .x { position:absolute; right:14px; top:calc(env(safe-area-inset-top,0px) + 12px); z-index:7; width:40px; height:40px; border-radius:50%; border:0; background:rgba(10,14,18,.6); color:#fff; font-size:18px; }
  .bar { position:absolute; left:10px; right:10px; bottom:calc(env(safe-area-inset-bottom,0px) + 34px); z-index:6; display:flex; align-items:center; gap:8px; background:rgba(10,14,18,.78); border-radius:18px; padding:8px 10px; }
  .bar button { border:0; border-radius:999px; background:rgba(255,255,255,.14); color:#fff; font:inherit; font-weight:700; font-size:14px; padding:9px 13px; white-space:nowrap; }
  .bar input { flex:1; min-width:0; accent-color:#ff2d8f; }
  #msg { position:absolute; left:20px; right:20px; top:42%; z-index:8; text-align:center; font-size:15px; color:#fff; background:rgba(10,14,18,.82); border-radius:16px; padding:16px; }
  #msg[hidden] { display:none; }
</style>
</head>
<body>
<div id="map"></div><div id="dot"></div>
<div class="top"><b>LITE <i>FOIL</i></b><span id="nm"></span>
  <div class="st"><div>Vitesse<strong><span id="sSpd">0</span><small> km/h</small></strong></div><div>Altitude<strong><span id="sAlt">0</span><small> ft</small></strong></div><div>Distance<strong><span id="sDst">0,0</span><small> km</small></strong></div></div></div>
<button class="x" id="bx" aria-label="Fermer">✕</button>
<div class="bar"><button id="bPlay">⏸</button><input id="seek" type="range" min="0" max="1000" value="0"><button id="bView">Poursuite</button><button id="bSpd">1×</button></div>
<div id="msg" hidden></div>
<script>
(async function(){
  const $=(i)=>document.getElementById(i), msg=(t)=>{ $("msg").textContent=t; $("msg").hidden=!t; };
  const KEY=String(window.LF_GMAPS_KEY||""), demo=/[?&]demo=1/.test(location.search);
  // secours : l'ancienne vue (globe satellite sans relief)
  let gone=false; const fall=()=>{ if(gone) return; gone=true; location.replace("vol3d-c.html"+location.search); };
  let g=null; try{ g=JSON.parse(sessionStorage.getItem("lf.fly3")||"null"); }catch(e){}
  // parcours d'un suivi en direct (vol d'un autre membre) : lu sur le serveur Lite Foil
  const liveSid=(location.search.match(/[?&]live=([A-Za-z0-9_-]+)/)||[])[1];
  if(liveSid){ msg("Chargement du parcours…");
    try{ const d=await fetch("https://litefoil-communaute-222fd.web.app/l/"+liveSid+".json").then(r=>r.json()); if(!d || !d.ok) throw 0;
      const T=(d.trk||[]).filter(p=>p && isFinite(+p[0]) && isFinite(+p[1])); if(T.length<2) throw 0;
      const t00=+T[0][3]||0, hasT=t00>0 && (+T[T.length-1][3]||0)>t00, pts=[]; let dd=0;
      T.forEach((p,i)=>{ const q={ lat:+p[0], lon:+p[1], alt:+p[2]||0, t:hasT ? ((+p[3]||t00)-t00)/1000 : i*3, speed:0, dist:0 };
        if(i){ const pv=pts[i-1], Rr=6371000, dy=(q.lat-pv.lat)*Math.PI/180*Rr, dx=(q.lon-pv.lon)*Math.PI/180*Rr*Math.cos(q.lat*Math.PI/180), s=Math.hypot(dx,dy); dd+=s; q.dist=dd; const dt=q.t-pv.t; q.speed=dt>0 ? Math.min(400, s/dt*3.6) : pv.speed; }
        pts.push(q); });
      if(pts.length>1) pts[0].speed=pts[1].speed;
      const airL=/ulm|avion|parapente/i.test(d.cat||"");
      g={ pts, name:(airL ? "Vol de " : "Sortie de ")+String(d.ps||"Membre"), milieu:airL ? "air" : "terre", who:String(d.ps||"").slice(0,24), av:"https://litefoil-communaute-222fd.web.app/l/"+liveSid+".jpg" }; msg(""); }
    catch(e){ msg("Ce parcours n'est plus disponible."); return; } }
  if(demo && !g){ // vol simulé autour du Canigou, pour essayer le moteur sans vrai vol
    const pts=[], N=420; let d=0, pv=null;
    for(let i=0;i<N;i++){ const k=i/(N-1), a=k*Math.PI*2, lat=42.555+Math.cos(a)*0.062+Math.sin(a*3)*0.006, lon=2.44+Math.sin(a)*0.085, alt=1300+Math.sin(k*Math.PI)*1650+Math.sin(k*14)*60;
      if(pv){ const R=6371000, dy=(lat-pv.lat)*Math.PI/180*R, dx=(lon-pv.lon)*Math.PI/180*R*Math.cos(lat*Math.PI/180); d+=Math.hypot(dx,dy); } pv={lat,lon};
      pts.push({ lat, lon, t:i*6, speed:135+Math.sin(k*9)*20, alt, dist:d }); }
    g={ pts, name:"Tour du Canigou (vol simulé)" }; }
  const back=()=>{ try{ if(history.length>1) history.back(); else location.replace("./"); }catch(e){ location.replace("./"); } };
  $("bx").onclick=back;

  if(!g || !Array.isArray(g.pts) || g.pts.length<2){ msg("Aucun vol à rejouer. Ouvre un vol dans Activités, puis « 3D photoréaliste »."); return; }
  if(!KEY){ fall(); return; }
  const P=g.pts.filter(p=>p && isFinite(+p.lat) && isFinite(+p.lon)).map(p=>({ lat:+p.lat, lon:+p.lon, alt:+p.alt||0, speed:+p.speed||0, dist:+p.dist||0, t:+p.t||0 })), N=P.length;
  const GROUND=(g.milieu==="terre");
  // 27/11 : l'altitude du GPS du téléphone saute (pics isolés, marches de plusieurs dizaines de mètres). Pour un vol : on retire les pics
  // (médiane sur 5 points), on borne la vitesse verticale à 8 m/s, puis on lisse sur une vingtaine de secondes. Le tracé au sol n'est pas touché.
  const lisseAlt=(Q)=>{ const n=Q.length; if(n<5) return; const a=Q.map(p=>p.alt), m=a.map((_,i)=>{ const w=[]; for(let j=Math.max(0,i-2);j<=Math.min(n-1,i+2);j++) w.push(a[j]); w.sort((x,y)=>x-y); return w[w.length>>1]; });
    for(let i=1;i<n;i++){ const dt=Math.max(1,(Q[i].t-Q[i-1].t)||3), lim=8*dt; if(m[i]-m[i-1]>lim) m[i]=m[i-1]+lim; else if(m[i-1]-m[i]>lim) m[i]=m[i-1]-lim; }
    for(let i=0;i<n;i++){ let s=0, w=0; for(let j=Math.max(0,i-8);j<=Math.min(n-1,i+8);j++){ const d=(Q[j].t-Q[i].t)||((j-i)*3); if(Math.abs(d)>24) continue; const k=Math.exp(-(d*d)/128); s+=m[j]*k; w+=k; } Q[i].alt=w>0 ? s/w : m[i]; } };
  if(!GROUND) lisseAlt(P);
  P.forEach(p=>{ p.a0=p.alt; });
  if(!(P[N-1].dist>0)){ let d=0; for(let i=1;i<N;i++){ const R=6371000, dy=(P[i].lat-P[i-1].lat)*Math.PI/180*R, dx=(P[i].lon-P[i-1].lon)*Math.PI/180*R*Math.cos(P[i].lat*Math.PI/180); d+=Math.hypot(dx,dy); P[i].dist=d; } }
  $("nm").textContent=String(g.name||"Vol").slice(0,60);
  msg("Chargement de la vue 3D…");

  // ----- relief sous le parcours (Open-Meteo) : sert à poser un vol qui démarre au sol, et à estimer la hauteur d'un vol sans altitude -----
  let est=false, off=0;
  try{ const M=Math.min(100,N), idx=[]; for(let k=0;k<M;k++) idx.push(Math.round(k*(N-1)/(M-1)));
    const r=await Promise.race([fetch("https://api.open-meteo.com/v1/elevation?latitude="+idx.map(i=>P[i].lat.toFixed(4)).join(",")+"&longitude="+idx.map(i=>P[i].lon.toFixed(4)).join(",")).then(x=>x.json()), new Promise(res=>setTimeout(()=>res(null),8000))]);
    const gr=r && Array.isArray(r.elevation) && r.elevation.length===M ? r.elevation.map(Number) : null;
    if(gr && gr.every(isFinite)){ for(let i=0;i<N;i++){ const x=i/(N-1)*(M-1), k0=Math.min(M-1,Math.floor(x)), k1=Math.min(M-1,k0+1); P[i].gr=gr[k0]+(gr[k1]-gr[k0])*(x-k0); }
      let lo=1e9, hi=-1e9; P.forEach(p=>{ if(p.alt<lo) lo=p.alt; if(p.alt>hi) hi=p.alt; });
      if(!GROUND && hi-lo<8){ // vol enregistré sans altitude : 150 m au-dessus du relief, montée et descente au début et à la fin
        const w=Math.max(2,Math.round(N/30)), sm=(t)=>t*t*(3-2*t);
        for(let i=0;i<N;i++){ let mx=-1e9; for(let j=Math.max(0,i-w);j<=Math.min(N-1,i+w);j++){ if(P[j].gr>mx) mx=P[j].gr; } const fr=i/(N-1), rp=sm(Math.max(0,Math.min(1,fr/0.1,(1-fr)/0.1))); P[i].alt=P[i].gr+2+((mx-P[i].gr)+150)*rp; }
        est=true; }
      else if(!GROUND && (P[0].speed<35 || P[0].alt<P[0].gr+2)) off=P[0].gr+2-P[0].alt; // le vol commence au sol : on recale l'altitude du GPS sur le relief
    } }catch(e){}
  if(!GROUND) P.forEach(p=>{ p.alt+=off; if(p.gr!=null && p.alt<p.gr+2) p.alt=p.gr+2; });

  // ----- moteur Google « 3D Maps » -----
  window.gm_authFailure=fall;
  try{ await new Promise((ok,ko)=>{ window.__lf3d=ok; const s=document.createElement("script"); s.onerror=ko; s.src="https://maps.googleapis.com/maps/api/js?key="+encodeURIComponent(KEY)+"&v=beta&loading=async&language=fr&callback=__lf3d"; document.head.appendChild(s); setTimeout(ko,15000); }); }catch(e){ fall(); return; }
  let L; try{ L=await google.maps.importLibrary("maps3d"); }catch(e){ fall(); return; }
  if(!L || !L.Map3DElement || !L.Polyline3DElement){ fall(); return; }
  const AM=GROUND ? "CLAMP_TO_GROUND" : "ABSOLUTE";
  const ll=(p)=>({ lat:p.lat, lng:p.lon, altitude:GROUND ? 0 : p.alt });
  // hauteur du point visé par la caméra : Google la compte au-dessus du niveau de la mer
  const camAlt=(p,alt)=>GROUND ? (p.gr!=null ? p.gr : p.a0) : alt;
  let map; try{ map=new L.Map3DElement({ center:{ lat:P[0].lat, lng:P[0].lon, altitude:camAlt(P[0],P[0].alt) }, range:GROUND?150:320, tilt:70, heading:0, mode:"SATELLITE" }); try{ if("defaultUIHidden" in map) map.defaultUIHidden=true; else map.defaultUIDisabled=true; }catch(e){}
    map.addEventListener("gmp-error", fall); $("map").appendChild(map); }catch(e){ fall(); return; }
  const setPath=(el,a)=>{ try{ if("path" in el) el.path=a; else el.coordinates=a; }catch(e){} };
  const line=(o)=>{ const el=new L.Polyline3DElement(); for(const k in o){ try{ el[k]=o[k]; }catch(e){} } map.appendChild(el); return el; };
  const step=Math.max(1,Math.ceil(N/500)), all=[]; for(let i=0;i<N;i+=step) all.push(ll(P[i])); all.push(ll(P[N-1]));
  const lAll=line({ altitudeMode:AM, strokeColor:"rgba(255,255,255,0.55)", strokeWidth:3, drawsOccludedSegments:true }); setPath(lAll, all);
  const lFly=line({ altitudeMode:AM, strokeColor:"#ff2d8f", strokeWidth:GROUND?9:7, outerColor:"#ffffff", outerWidth:0.25, drawsOccludedSegments:true });
  const lTip=line({ altitudeMode:AM, strokeColor:"#ff2d8f", strokeWidth:GROUND?9:7, drawsOccludedSegments:true });

  let plane=null;
  if(GROUND){ $("dot").style.display="block"; const u=$("sAlt").nextElementSibling; if(u) u.textContent=" m"; }
  else if(L.Model3DElement){ try{ plane=new L.Model3DElement(); plane.src=new URL("avion.glb", location.href).href; plane.altitudeMode="ABSOLUTE"; plane.scale=11; plane.position=ll(P[0]); map.appendChild(plane); }catch(e){ plane=null; } }
  if(!plane && !GROUND) $("dot").style.display="block";

  // ----- lecture -----
  const rad=Math.PI/180, brg=(p,q)=>{ const y=Math.sin((q.lon-p.lon)*rad)*Math.cos(q.lat*rad), x=Math.cos(p.lat*rad)*Math.sin(q.lat*rad)-Math.sin(p.lat*rad)*Math.cos(q.lat*rad)*Math.cos((q.lon-p.lon)*rad); return (Math.atan2(y,x)/rad+360)%360; };
  const lerpA=(a,b,k)=>{ const d=((b-a+540)%360)-180; return (a+d*k+360)%360; };
  let prog=0, paused=false, seeking=false, mul=1, mode=0, last=performance.now(), head=0, camH=null, roll=0, pitch=0, orb=0, curI=-1;
  const realS=Math.max(0,(P[N-1].t-P[0].t)||0), BASE=Math.max(150000, Math.min(720000, realS>0 ? realS*1000/12 : N*900));
  const RG=GROUND ? [150,340,850] : [320,900,2600], TL=GROUND ? [64,58,10] : [73,66,12];
  const VIEWS=["Poursuite","Orbite","Dessus"];
  function draw(fromSeek){
    const fi=prog*(N-1), i=Math.min(N-1,Math.floor(fi)), f=fi-i, a=P[i], b=P[Math.min(N-1,i+1)];
    const lon=a.lon+(b.lon-a.lon)*f, lat=a.lat+(b.lat-a.lat)*f, alt=a.alt+(b.alt-a.alt)*f, here={lon,lat}, cur={ lat, lng:lon, altitude:GROUND?0:alt };
    if(fromSeek || i!==curI){ curI=i; const fl=[]; for(let k=0;k<=i;k+=step) fl.push(ll(P[k])); if(fl.length<2) fl.push(ll(P[Math.min(N-1,1)])); setPath(lFly, i>0 ? fl : []); }
    setPath(lTip, [ll(a), cur]);
    const k3=Math.max(3,Math.round(N/200)), q0=P[Math.max(0,i-k3)], q1=P[Math.min(N-1,i+k3)];
    if(q1.lon!==lon || q1.lat!==lat){ const w=brg(here,q1); head=fromSeek ? w : lerpA(head,w,0.12); }
    let tr=0; if(i-k3>=0 && i+k3<N && (q0.lon!==lon || q0.lat!==lat)) tr=((brg(here,q1)-brg(q0,here)+540)%360)-180;
    const cl=Math.atan2(q1.alt-q0.alt, Math.max(1,q1.dist-q0.dist))/rad, cp=(v,m)=>Math.max(-m,Math.min(m,v)), kk=fromSeek?1:0.07;
    roll+=(cp(tr*1.3,38)-roll)*kk; pitch+=(cp(cl,22)-pitch)*kk;
    if(plane){ try{ plane.position=cur; plane.orientation={ heading:(head+180+360)%360, tilt:(pitch-90), roll:0 }; }catch(e){} }
    // caméra : elle vise toujours l'appareil, qui reste donc au centre de l'écran
    let h=0; if(mode===0){ camH=(camH==null || fromSeek) ? head : lerpA(camH,head,0.05); h=camH; } else if(mode===1) h=orb;
    if(plane && plane.__m!==mode){ plane.__m=mode; try{ plane.scale=RG[mode]*0.05; }catch(e){} }
    try{ map.center={ lat, lng:lon, altitude:camAlt(a,alt) }; map.heading=h; map.tilt=TL[mode]; map.range=RG[mode]; }catch(e){}
    $("sSpd").textContent=Math.round(a.speed+(b.speed-a.speed)*f); $("sAlt").textContent=est ? "—" : (GROUND ? Math.round(a.a0+(b.a0-a.a0)*f) : Math.round((alt-off)*3.28084)); $("sDst").textContent=((a.dist+(b.dist-a.dist)*f)/1000).toFixed(1).replace(".",",");
    if(!seeking) $("seek").value=Math.round(prog*1000);
  }
  // bulle photo + nom du membre, au-dessus de l'appareil (centre de l'écran)
  (function(){ const who=String((g && g.who)||"").slice(0,24), av=String((g && g.av)||""), okAv=/^(data:image[/](jpeg|png|webp);base64,[A-Za-z0-9+/=]+|https:[/][/][^"'<> ]+)$/.test(av); if(!who && !okAv) return;
    const pin=document.createElement("div"); pin.id="pin"; const b=document.createElement("b"); b.textContent=who; const sp=document.createElement("span");
    if(okAv){ const im=document.createElement("img"); im.alt=""; im.onerror=()=>{ sp.style.display="none"; }; im.src=av; sp.appendChild(im); } else sp.style.display="none";
    const tl=document.createElement("i"); pin.appendChild(b); pin.appendChild(sp); pin.appendChild(tl); pin.style.display="flex"; document.body.appendChild(pin); })();
  function frame(now){ const dt=Math.max(0, Math.min(250, now-last)); last=now;
    if(!paused && !seeking){ prog=Math.min(1, prog+dt/BASE*mul); orb=(orb+dt/1000*6)%360; draw(false); if(prog>=1){ paused=true; $("bPlay").textContent="▶"; } }
    requestAnimationFrame(frame); }
  $("bPlay").onclick=()=>{ if(prog>=1){ prog=0; paused=false; } else paused=!paused; $("bPlay").textContent=paused?"▶":"⏸"; last=performance.now(); };
  $("bView").onclick=()=>{ mode=(mode+1)%3; $("bView").textContent=VIEWS[mode]; camH=null; draw(true); };
  $("bSpd").onclick=()=>{ mul = mul===0.5 ? 1 : (mul===1 ? 2 : (mul===2 ? 4 : 0.5)); $("bSpd").textContent=(mul===0.5?"½":mul)+"×"; };
  $("seek").oninput=()=>{ seeking=true; prog=(+$("seek").value)/1000; draw(true); }; $("seek").onchange=()=>{ seeking=false; last=performance.now(); };
  window.__v3={ map, plane, state:()=>({ prog, mode, off, est }) };
  if(est){ const nt=document.createElement("div"); nt.textContent="Altitude non enregistrée pour ce vol : hauteur estimée"; nt.style.cssText="position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 128px);z-index:5;text-align:center;font-size:12px;font-weight:700;color:#ffd84a;text-shadow:0 1px 3px rgba(0,0,0,.8);pointer-events:none"; document.body.appendChild(nt); }
  msg(""); draw(true); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
