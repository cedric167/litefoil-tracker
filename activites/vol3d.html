<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Lite Foil : vol en 3D</title>
<!-- 21/11/2026 : maquette du replay d'un vol sur les tuiles 3D photoréalistes de Google (moteur CesiumJS).
     La clé Google (API « Map Tiles ») est dans ../gmaps-key.js. Sans clé, la page ne s'ouvre qu'en essai (?demo=1), sur un globe plat. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.119.0/Widgets/widgets.min.css">
<script>window.CESIUM_BASE_URL="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.119.0/";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.119.0/Cesium.js"></script>
<script src="../gmaps-key.js"></script>
<style>
  html, body { margin:0; height:100%; background:#0b0d10; color:#fff; font:15px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
  #map { position:absolute; inset:0; }
  .top { position:absolute; left:0; right:0; top:0; padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 26px; text-align:center; pointer-events:none; z-index:5;
         background:linear-gradient(rgba(6,10,14,.72), rgba(6,10,14,0)); }
  .top b { display:block; font-size:12px; letter-spacing:.28em; } .top b i { font-style:normal; color:#19e3ff; }
  .top > span { display:block; font-size:14px; color:#d6e3ea; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .st { display:flex; justify-content:space-around; margin-top:8px; }
  .st div { font-size:10.5px; letter-spacing:.08em; color:#b9c8cf; text-transform:uppercase; }
  .st div strong { display:block; font-size:25px; letter-spacing:0; color:#fff; text-transform:none; font-variant-numeric:tabular-nums; }
  .st small { font-size:12px; font-weight:600; color:#d6e3ea; }
  .x { position:absolute; right:14px; top:calc(env(safe-area-inset-top,0px) + 12px); z-index:7; width:40px; height:40px; border-radius:50%; border:0; background:rgba(10,14,18,.6); color:#fff; font-size:18px; }
  .bar { position:absolute; left:10px; right:10px; bottom:calc(env(safe-area-inset-bottom,0px) + 34px); z-index:6; display:flex; align-items:center; gap:8px; background:rgba(10,14,18,.78); border-radius:18px; padding:8px 10px; }
  .bar button { border:0; border-radius:999px; background:rgba(255,255,255,.14); color:#fff; font:inherit; font-weight:700; font-size:14px; padding:9px 13px; white-space:nowrap; }
  .bar input { flex:1; min-width:0; accent-color:#ff2d8f; }
  #msg { position:absolute; left:20px; right:20px; top:42%; z-index:8; text-align:center; font-size:15px; color:#fff; background:rgba(10,14,18,.82); border-radius:16px; padding:16px; }
  #msg[hidden] { display:none; }
  .cesium-viewer-bottom { bottom:calc(env(safe-area-inset-bottom,0px) + 2px) !important; }
  .cesium-widget-credits { font-size:9px !important; }
</style>
</head>
<body>
<div id="map"></div>
<div class="top"><b>LITE <i>FOIL</i></b><span id="nm"></span>
  <div class="st"><div>Vitesse<strong><span id="sSpd">0</span><small> km/h</small></strong></div><div>Altitude<strong><span id="sAlt">0</span><small> ft</small></strong></div><div>Distance<strong><span id="sDst">0,0</span><small> km</small></strong></div></div></div>
<button class="x" id="bx" aria-label="Fermer">✕</button>
<div class="bar"><button id="bPlay">⏸</button><input id="seek" type="range" min="0" max="1000" value="0"><button id="bView">Poursuite</button><button id="bSpd">1×</button></div>
<div id="msg" hidden></div>
<script>
(async function(){
  const $=(i)=>document.getElementById(i), msg=(t)=>{ $("msg").textContent=t; $("msg").hidden=!t; };
  const KEY=String(window.LF_GMAPS_KEY||""), demo=/[?&]demo=1/.test(location.search);
  let g=null; try{ g=JSON.parse(sessionStorage.getItem("lf.fly3")||"null"); }catch(e){}
  if(demo && !g){ // vol simulé autour du Canigou, pour essayer le moteur sans vrai vol
    const pts=[], N=420; let d=0, pv=null;
    for(let i=0;i<N;i++){ const k=i/(N-1), a=k*Math.PI*2, lat=42.555+Math.cos(a)*0.062+Math.sin(a*3)*0.006, lon=2.44+Math.sin(a)*0.085, alt=1300+Math.sin(k*Math.PI)*1650+Math.sin(k*14)*60;
      if(pv){ const R=6371000, dy=(lat-pv.lat)*Math.PI/180*R, dx=(lon-pv.lon)*Math.PI/180*R*Math.cos(lat*Math.PI/180); d+=Math.hypot(dx,dy); } pv={lat,lon};
      pts.push({ lat, lon, t:i*6, speed:135+Math.sin(k*9)*20, alt, dist:d }); }
    g={ pts, name:"Tour du Canigou (vol simulé)" }; }
  const back=()=>{ try{ if(history.length>1) history.back(); else location.replace("./"); }catch(e){ location.replace("./"); } };
  $("bx").onclick=back;
  if(!g || !Array.isArray(g.pts) || g.pts.length<2){ msg("Aucun vol à rejouer. Ouvre un vol dans Activités, puis « 3D photoréaliste »."); return; }
  if(!KEY && !demo){ msg("La vue 3D photoréaliste n'est pas encore activée."); return; }
  const P=g.pts.filter(p=>p && isFinite(+p.lat) && isFinite(+p.lon)).map(p=>({ lat:+p.lat, lon:+p.lon, alt:+p.alt||0, speed:+p.speed||0, dist:+p.dist||0, t:+p.t||0 })), N=P.length;
  if(!(P[N-1].dist>0)){ let d=0; for(let i=1;i<N;i++){ const R=6371000, dy=(P[i].lat-P[i-1].lat)*Math.PI/180*R, dx=(P[i].lon-P[i-1].lon)*Math.PI/180*R*Math.cos(P[i].lat*Math.PI/180); d+=Math.hypot(dx,dy); P[i].dist=d; } }
  $("nm").textContent=String(g.name||"Vol").slice(0,60);

  // ----- moteur -----
  const C=Cesium; try{ C.Ion.defaultAccessToken=""; }catch(e){}
  const opt={ animation:false, timeline:false, baseLayerPicker:false, geocoder:false, homeButton:false, sceneModePicker:false, navigationHelpButton:false, fullscreenButton:false, infoBox:false, selectionIndicator:false, shouldAnimate:false };
  if(KEY){ opt.globe=false; opt.baseLayer=false; }
  else opt.baseLayer=new C.ImageryLayer(new C.UrlTemplateImageryProvider({ url:"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", maximumLevel:17, credit:"Esri World Imagery" }));
  let viewer; try{ viewer=new C.Viewer("map", opt); }catch(e){ msg("La 3D ne démarre pas sur cet appareil."); return; }
  const scene=viewer.scene; try{ scene.skyAtmosphere.show=true; if(scene.globe) scene.globe.depthTestAgainstTerrain=true; }catch(e){}
  try{ viewer.resolutionScale=Math.min(window.devicePixelRatio||1, 2); }catch(e){}
  let off=0;
  if(KEY){ msg("Chargement de la vue 3D…");
    try{ const ts=await C.Cesium3DTileset.fromUrl("https://tile.googleapis.com/v1/3dtiles/root.json?key="+encodeURIComponent(KEY), { showCreditsOnScreen:true }); scene.primitives.add(ts); }
    catch(e){ msg("La vue 3D photoréaliste n'a pas pu se charger (clé refusée ou réseau)."); return; }
    // les altitudes du GPS et celles de Google n'ont pas la même référence : si le vol commence au sol, on recale sur le sol de Google
    try{ viewer.camera.lookAt(C.Cartesian3.fromDegrees(P[0].lon,P[0].lat,P[0].alt), new C.HeadingPitchRange(0,-0.6,1500)); viewer.camera.lookAtTransform(C.Matrix4.IDENTITY);
      const r=await Promise.race([scene.sampleHeightMostDetailed([C.Cartographic.fromDegrees(P[0].lon,P[0].lat)]), new Promise(res=>setTimeout(()=>res(null),9000))]);
      const h=r && r[0] && isFinite(r[0].height) ? r[0].height : null;
      if(h!=null && (P[0].speed<35 || P[0].alt<h+2)) off=h+2-P[0].alt; }catch(e){}
    msg(""); }
  P.forEach(p=>{ p.c=C.Cartesian3.fromDegrees(p.lon,p.lat,p.alt+off); });

  // ----- avion : maillage dessiné par le code, emballé en fichier glTF binaire -----
  function planeGlb(){ const tri=[], PK=[1,0.176,0.56,1], W=[0.97,0.97,0.98,1], K=[0.10,0.16,0.22,1], G2=[0.8,0.82,0.86,1];
    const face=(a,b,c,col)=>{ const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]], v=[c[0]-a[0],c[1]-a[1],c[2]-a[2]]; let n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]]; const l=Math.hypot(n[0],n[1],n[2])||1; tri.push([a,b,c,[n[0]/l,n[1]/l,n[2]/l],col]); };
    const quad=(a,b,c,d,col)=>{ face(a,b,c,col); face(a,c,d,col); };
    const box=(x0,x1,y0,y1,z0,z1,col)=>{ const A=[x0,y0,z0],B=[x1,y0,z0],Cc=[x1,y1,z0],D=[x0,y1,z0],E=[x0,y0,z1],F=[x1,y0,z1],G=[x1,y1,z1],H=[x0,y1,z1]; quad(E,F,G,H,col); quad(D,Cc,B,A,col); quad(A,B,F,E,col); quad(Cc,D,H,G,col); quad(B,Cc,G,F,col); quad(D,A,E,H,col); };
    const prof=[[0.47,0.004],[0.43,0.03],[0.33,0.052],[0.16,0.06],[-0.08,0.052],[-0.30,0.026],[-0.47,0.012]], S=10;
    for(let k=0;k<prof.length-1;k++){ const a=prof[k], b=prof[k+1]; for(let j=0;j<S;j++){ const t0=j/S*Math.PI*2, t1=(j+1)/S*Math.PI*2, col=(k===0?PK:(k===3 && Math.sin((t0+t1)/2)>0.35 ? K : W));
        quad([a[0],Math.cos(t0)*a[1],Math.sin(t0)*a[1]*1.15],[a[0],Math.cos(t1)*a[1],Math.sin(t1)*a[1]*1.15],[b[0],Math.cos(t1)*b[1],Math.sin(t1)*b[1]*1.15],[b[0],Math.cos(t0)*b[1],Math.sin(t0)*b[1]*1.15],col); } }
    box(0.02,0.19,-0.41,0.41,0.062,0.076,W); box(0.02,0.19,-0.5,-0.41,0.062,0.076,PK); box(0.02,0.19,0.41,0.5,0.062,0.076,PK);
    box(-0.47,-0.38,-0.17,0.17,0.012,0.022,W); box(-0.47,-0.36,-0.006,0.006,0.012,0.16,PK);
    box(0.10,0.14,-0.2,-0.19,0,0.066,G2); box(0.10,0.14,0.19,0.2,0,0.066,G2);
    // repère du modèle (avant x, droite y, haut z) vers glTF (haut y, avant z) ; normales tournées vers l'extérieur du fuselage
    const m=(v)=>[-v[1],v[2],v[0]], n=tri.length*3, pos=new Float32Array(n*3), nor=new Float32Array(n*3), col=new Float32Array(n*4); let mn=[1e9,1e9,1e9], mx=[-1e9,-1e9,-1e9], k=0;
    tri.forEach(t=>{ let a=m(t[0]), b=m(t[1]), c=m(t[2]); const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]], v=[c[0]-a[0],c[1]-a[1],c[2]-a[2]], nn=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]], l=Math.hypot(nn[0],nn[1],nn[2])||1;
      const cen=[(a[0]+b[0]+c[0])/3,(a[1]+b[1]+c[1])/3,0]; let N3=[nn[0]/l,nn[1]/l,nn[2]/l];
      [a,b,c].forEach(p=>{ pos.set(p,k*3); nor.set(N3,k*3); col.set(t[4],k*4); for(let j=0;j<3;j++){ if(p[j]<mn[j]) mn[j]=p[j]; if(p[j]>mx[j]) mx[j]=p[j]; } k++; }); });
    const bin=new Uint8Array(pos.byteLength+nor.byteLength+col.byteLength); bin.set(new Uint8Array(pos.buffer),0); bin.set(new Uint8Array(nor.buffer),pos.byteLength); bin.set(new Uint8Array(col.buffer),pos.byteLength+nor.byteLength);
    const json={ asset:{version:"2.0"}, scene:0, scenes:[{nodes:[0]}], nodes:[{mesh:0}], meshes:[{primitives:[{attributes:{POSITION:0,NORMAL:1,COLOR_0:2},material:0,mode:4}]}],
      materials:[{pbrMetallicRoughness:{baseColorFactor:[1,1,1,1],metallicFactor:0,roughnessFactor:0.55},doubleSided:true}],
      accessors:[{bufferView:0,componentType:5126,count:n,type:"VEC3",min:mn,max:mx},{bufferView:1,componentType:5126,count:n,type:"VEC3"},{bufferView:2,componentType:5126,count:n,type:"VEC4"}],
      bufferViews:[{buffer:0,byteOffset:0,byteLength:pos.byteLength,target:34962},{buffer:0,byteOffset:pos.byteLength,byteLength:nor.byteLength,target:34962},{buffer:0,byteOffset:pos.byteLength+nor.byteLength,byteLength:col.byteLength,target:34962}],
      buffers:[{byteLength:bin.byteLength}] };
    let js=new TextEncoder().encode(JSON.stringify(json)); const pad=(4-js.length%4)%4; if(pad){ const t=new Uint8Array(js.length+pad); t.set(js); t.fill(32,js.length); js=t; }
    const total=12+8+js.length+8+bin.byteLength, out=new ArrayBuffer(total), dv=new DataView(out), u8=new Uint8Array(out);
    dv.setUint32(0,0x46546C67,true); dv.setUint32(4,2,true); dv.setUint32(8,total,true); dv.setUint32(12,js.length,true); dv.setUint32(16,0x4E4F534A,true); u8.set(js,20);
    dv.setUint32(20+js.length,bin.byteLength,true); dv.setUint32(24+js.length,0x004E4942,true); u8.set(bin,28+js.length);
    return URL.createObjectURL(new Blob([out],{type:"model/gltf-binary"})); }

  // ----- lecture -----
  const rad=Math.PI/180, brg=(p,q)=>{ const y=Math.sin((q.lon-p.lon)*rad)*Math.cos(q.lat*rad), x=Math.cos(p.lat*rad)*Math.sin(q.lat*rad)-Math.sin(p.lat*rad)*Math.cos(q.lat*rad)*Math.cos((q.lon-p.lon)*rad); return (Math.atan2(y,x)/rad+360)%360; };
  const lerpA=(a,b,k)=>{ const d=((b-a+540)%360)-180; return (a+d*k+360)%360; };
  let prog=0, paused=false, seeking=false, mul=1, mode=0, last=performance.now(), head=0, camH=null, roll=0, pitch=0, orb=0, cur=P[0].c, curI=0, flown=[P[0].c,P[0].c];
  const realS=Math.max(0,(P[N-1].t-P[0].t)||0), BASE=Math.max(150000, Math.min(720000, realS>0 ? realS*1000/12 : N*900)), step=Math.max(1,Math.ceil(N/500));
  const cart=[]; for(let i=0;i<N;i+=step) cart.push(P[i].c); cart.push(P[N-1].c);
  const quat=new C.Quaternion(), hpr=new C.HeadingPitchRoll();
  const pink=C.Color.fromCssColorString("#ff2d8f");
  viewer.entities.add({ polyline:{ positions:cart, width:2, material:C.Color.WHITE.withAlpha(0.35) } });
  viewer.entities.add({ polyline:{ positions:new C.CallbackProperty(()=>flown,false), width:7, material:new C.PolylineGlowMaterialProperty({ glowPower:0.22, color:pink }) } });
  viewer.entities.add({ wall:{ positions:new C.CallbackProperty(()=>flown,false), material:pink.withAlpha(0.2) } });
  viewer.entities.add({ position:new C.CallbackProperty(()=>cur,false), orientation:new C.CallbackProperty(()=>quat,false),
    model:{ uri:planeGlb(), scale:11, minimumPixelSize:70, maximumScale:6000 } });
  const VIEWS=["Poursuite","Orbite","Dessus"];
  function draw(fromSeek){
    const fi=prog*(N-1), i=Math.min(N-1,Math.floor(fi)), f=fi-i, a=P[i], b=P[Math.min(N-1,i+1)];
    const lon=a.lon+(b.lon-a.lon)*f, lat=a.lat+(b.lat-a.lat)*f, alt=a.alt+(b.alt-a.alt)*f, here={lon,lat};
    cur=C.Cartesian3.fromDegrees(lon,lat,alt+off);
    if(fromSeek || i!==curI || flown.length<3){ curI=i; flown=[]; for(let k=0;k<=i;k+=step) flown.push(P[k].c); flown.push(cur); } else flown[flown.length-1]=cur;
    const k3=Math.max(3,Math.round(N/200)), q0=P[Math.max(0,i-k3)], q1=P[Math.min(N-1,i+k3)];
    if(q1.lon!==lon || q1.lat!==lat){ const w=brg(here,q1); head=fromSeek ? w : lerpA(head,w,0.12); }
    let tr=0; if(i-k3>=0 && i+k3<N && (q0.lon!==lon || q0.lat!==lat)) tr=((brg(here,q1)-brg(q0,here)+540)%360)-180;
    const cl=Math.atan2(q1.alt-q0.alt, Math.max(1,q1.dist-q0.dist))/rad, cp=(v,m)=>Math.max(-m,Math.min(m,v)), kk=fromSeek?1:0.07;
    roll+=(cp(tr*1.3,38)-roll)*kk; pitch+=(cp(cl,22)-pitch)*kk;
    hpr.heading=(head-90)*rad; hpr.pitch=-pitch*rad; hpr.roll=roll*rad; C.Transforms.headingPitchRollQuaternion(cur, hpr, C.Ellipsoid.WGS84, C.Transforms.eastNorthUpToFixedFrame, quat);
    // caméra
    if(mode===0){ camH=(camH==null || fromSeek) ? head : lerpA(camH,head,0.05); viewer.camera.lookAt(cur, new C.HeadingPitchRange(camH*rad, -17*rad, 320)); }
    else if(mode===1){ viewer.camera.lookAt(cur, new C.HeadingPitchRange(orb*rad, -24*rad, 900)); }
    else { viewer.camera.lookAt(cur, new C.HeadingPitchRange(0, -78*rad, 2600)); }
    $("sSpd").textContent=Math.round(a.speed+(b.speed-a.speed)*f); $("sAlt").textContent=Math.round(alt*3.28084); $("sDst").textContent=((a.dist+(b.dist-a.dist)*f)/1000).toFixed(1).replace(".",",");
    if(!seeking) $("seek").value=Math.round(prog*1000);
  }
  function frame(now){ const dt=Math.max(0, Math.min(250, now-last)); last=now;
    if(!paused && !seeking){ prog=Math.min(1, prog+dt/BASE*mul); orb=(orb+dt/1000*6)%360; draw(false); if(prog>=1){ paused=true; $("bPlay").textContent="▶"; } }
    requestAnimationFrame(frame); }
  $("bPlay").onclick=()=>{ if(prog>=1){ prog=0; paused=false; } else paused=!paused; $("bPlay").textContent=paused?"▶":"⏸"; last=performance.now(); };
  $("bView").onclick=()=>{ mode=(mode+1)%3; $("bView").textContent=VIEWS[mode]; camH=null; draw(true); };
  $("bSpd").onclick=()=>{ mul = mul===0.5 ? 1 : (mul===1 ? 2 : (mul===2 ? 4 : 0.5)); $("bSpd").textContent=(mul===0.5?"½":mul)+"×"; };
  $("seek").oninput=()=>{ seeking=true; prog=(+$("seek").value)/1000; draw(true); }; $("seek").onchange=()=>{ seeking=false; last=performance.now(); };
  window.__v3={ viewer, state:()=>({ prog, mode, off }) };
  draw(true); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
