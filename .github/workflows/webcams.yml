# Lite Foil : met à jour chaque jour les identifiants des webcams du littoral (directs YouTube).
# Quand une chaîne relance son direct, l'identifiant change : scripts/update-webcams.mjs retrouve le nouveau
# et le fichier webcams/index.json est corrigé tout seul. Lançable aussi à la main (onglet Actions → Run workflow).
name: Webcams du littoral

on:
  schedule:
    - cron: "23 4 * * *"   # tous les jours vers 5 h 30 (heure de Paris en hiver)
    - cron: "23 13 * * *"  # et en début d'après-midi
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webcams
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chercher les directs
        run: node scripts/update-webcams.mjs
      - name: Enregistrer si quelque chose a changé
        run: |
          if git diff --quiet -- webcams/index.json; then echo "Rien à changer."; exit 0; fi
          git config user.name "Lite Foil webcams"
          git config user.email "noreply@github.com"
          git add webcams/index.json
          git commit -m "Webcams : identifiants des directs mis à jour"
          git pull --rebase origin main
          git push origin HEAD:main
