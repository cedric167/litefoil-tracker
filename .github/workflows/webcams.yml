# Lite Foil : identifiants des webcams du littoral (directs YouTube).
# 13/11 : YouTube bloque la lecture de ses pages depuis les serveurs GitHub (demande de connexion), donc plus de
# planification ici : la mise à jour quotidienne tourne sur le PC (tâche planifiée Windows « LiteFoil webcams »,
# scripts/update-webcams.cmd). Ce workflow reste lançable à la main pour refaire l'essai (onglet Actions → Run workflow).
name: Webcams du littoral

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webcams
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chercher les directs
        run: node scripts/update-webcams.mjs
      - name: Enregistrer si quelque chose a changé
        run: |
          if git diff --quiet -- webcams/index.json; then echo "Rien à changer."; exit 0; fi
          git config user.name "Lite Foil webcams"
          git config user.email "noreply@github.com"
          git add webcams/index.json
          git commit -m "Webcams : identifiants des directs mis à jour"
          git pull --rebase origin main
          git push origin HEAD:main
