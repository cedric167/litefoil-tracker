<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>essai 3D</title>
<style>html,body{margin:0;height:100%}gmp-map-3d{width:100%;height:100%;display:block}</style></head><body>
<div id="o" style="position:fixed;z-index:9;top:0;left:0;background:#fff;font:12px monospace;padding:4px;max-width:100%"></div>
<script src="gmaps-key.js"></script>
<script>
window.gm_authFailure=function(){ document.getElementById("o").textContent+=" AUTH-FAILURE"; };
window.addEventListener("error",function(e){ document.getElementById("o").textContent+=" ERR:"+e.message; });
window.go=async function(){ try{ const {Map3DElement}=await google.maps.importLibrary("maps3d");
  const m=new Map3DElement({ center:{lat:42.52,lng:2.456,altitude:2500}, range:9000, tilt:65, heading:0, mode:"SATELLITE" });
  m.addEventListener("gmp-error",e=>{ document.getElementById("o").textContent+=" GMP-ERROR"; });
  document.body.appendChild(m); document.getElementById("o").textContent+=" map-added"; }catch(e){ document.getElementById("o").textContent+=" EX:"+e.message; } };
const s=document.createElement("script"); s.src="https://maps.googleapis.com/maps/api/js?key="+encodeURIComponent(window.LF_GMAPS_KEY)+"&v=beta&loading=async&callback=go"; document.head.appendChild(s);
</script></body></html>
