# Recette de build iOS pour Codemagic (serveur Mac dans le cloud).
# PHASE 2 (à faire ensemble dans l'interface Codemagic) :
#   - connecter ce dépôt GitHub,
#   - ajouter l'intégration "App Store Connect" (clé API Apple) et la nommer "litefoil_appstore",
#   - activer la signature automatique (distribution App Store).
# Ensuite, chaque build génère l'app, la signe et l'envoie sur TestFlight.

workflows:
  ios-appstore:
    name: Lite Foil - iOS (App Store / TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: litefoil_appstore        # <- nom de la cle API Apple dans Codemagic (Phase 2)
    environment:
      xcode: latest
      cocoapods: default
      node: 20
      vars:
        BUNDLE_ID: "fr.litefoil.tracker"
        APP_NAME: "Lite Foil"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: fr.litefoil.tracker
    scripts:
      - name: Installer les dependances
        script: npm install
      - name: Assembler le dossier www (site + pont Bluetooth)
        script: npm run build:www
      - name: Generer / synchroniser le projet iOS
        script: |
          # notifications + connexion Apple/Google : modules Firebase seulement si le fichier de config iOS est fourni
          set -e
          if [ -f ios-assets/GoogleService-Info.plist ]; then npm install @capacitor-firebase/messaging@6.3.1 @capacitor-firebase/authentication@6.3.1 firebase@10.12.5; fi
          if [ ! -d "ios" ]; then npx cap add ios; fi
          # permissions, Bluetooth en arriere-plan, chiffrement, iOS 15, icone, ecran de demarrage, module LfTrack (suivi GPS)
          bash scripts/ios-setup.sh
          npx cap sync ios
          # connexion Google sur iPhone : sous-module Google du module de connexion, puis pods
          bash scripts/ios-post-sync.sh
      - name: Sign in with Apple (identifiant et profil Apple)
        script: python3 scripts/ios-signin-apple.py
      - name: Signature automatique
        script: |
          xcode-project use-profiles
      - name: Droits de l appli (notifications, Sign in with Apple)
        script: bash scripts/ios-entitlements.sh
      - name: Numero de build
        script: |
          cd ios/App
          agvtool new-marketing-version 1.5.1 || true
          agvtool new-version -all $(($(date +%s) / 60)) || true
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App" || { echo "===== ERREURS XCODE ====="; grep -h -B2 -A8 -E "error:|ARCHIVE FAILED|provisioning profile" /tmp/xcodebuild_logs/*.log | head -200; exit 1; }
          bash scripts/ios-entitlements.sh verifie
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # ----------------------------------------------------------------------------
  # iOS + APPLE WATCH (bouton SOS sur la montre). Même recette que ci-dessus, avec en plus :
  #   - la cible « LiteFoilWatch » ajoutée au projet (scripts/ios-watch.sh, sources dans native/watch),
  #   - l'identifiant fr.litefoil.tracker.watchkitapp et son profil App Store (scripts/ios-watch-signing.py),
  #   - la même version et le même numéro de build pour l'iPhone et la montre (exigé par Apple).
  # La recette « ios-appstore » ci-dessus reste intacte tant que celle-ci n'a pas été validée sur une vraie montre.
  ios-watch:
    name: Lite Foil - iOS + Apple Watch (TestFlight)
    # se lance tout seul quand une étiquette Git « watch-… » est poussée (pas besoin de l'interface Codemagic)
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "watch-*"
          include: true
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: litefoil_appstore
    environment:
      xcode: latest
      cocoapods: default
      node: 20
      vars:
        BUNDLE_ID: "fr.litefoil.tracker"
        WATCH_BUNDLE_ID: "fr.litefoil.tracker.watchkitapp"
        APP_NAME: "Lite Foil"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: fr.litefoil.tracker
    scripts:
      - name: Installer les dependances
        script: npm install
      - name: Assembler le dossier www (site + pont Bluetooth)
        script: npm run build:www
      - name: Generer / synchroniser le projet iOS
        script: |
          set -e
          if [ -f ios-assets/GoogleService-Info.plist ]; then npm install @capacitor-firebase/messaging@6.3.1 @capacitor-firebase/authentication@6.3.1 firebase@10.12.5; fi
          if [ ! -d "ios" ]; then npx cap add ios; fi
          bash scripts/ios-setup.sh
          npx cap sync ios
          bash scripts/ios-post-sync.sh
      - name: Ajouter l'appli Apple Watch (bouton SOS)
        script: bash scripts/ios-watch.sh
      - name: Sign in with Apple (identifiant et profil Apple)
        script: python3 scripts/ios-signin-apple.py
      - name: Identifiant et profil Apple de l'appli montre
        script: python3 scripts/ios-watch-signing.py
      - name: Signature automatique
        script: |
          xcode-project use-profiles
      - name: Droits de l appli (notifications, Sign in with Apple)
        script: bash scripts/ios-entitlements.sh
      - name: Numero de build (identique iPhone et montre)
        script: |
          bash scripts/ios-watch.sh version 1.7.3 $(($(date +%s) / 60))
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App" || { echo "===== ERREURS XCODE ====="; grep -h -B2 -A8 -E "error:|ARCHIVE FAILED|provisioning profile" /tmp/xcodebuild_logs/*.log | head -200; exit 1; }
          bash scripts/ios-entitlements.sh verifie
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # ----------------------------------------------------------------------------
  # SOUMISSION A APPLE d'un build deja sur TestFlight, sans passer par le site d'Apple.
  # Se lance quand une etiquette Git « submit-<version>-<build> » est poussee (ex. submit-1.7.2-29922009).
  # Nouveautes : scripts/ios-nouveautes.json. A ne lancer qu'avec l'accord de Cedric.
  ios-submit:
    name: Lite Foil - Soumettre a Apple (App Store)
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "submit-*"
          include: true
    instance_type: mac_mini_m2
    max_build_duration: 15
    integrations:
      app_store_connect: litefoil_appstore
    environment:
      vars:
        BUNDLE_ID: "fr.litefoil.tracker"
    scripts:
      - name: Soumettre la version a Apple
        script: python3 scripts/ios-submit.py

  # ----------------------------------------------------------------------------
  # MONTRE ANDROID (Wear OS) : appli autonome dans native/wear (SOS + ecrans d'infos). Paquet .aab signe avec la cle Lite Foil.
  # Se lance quand une etiquette Git « wear-… » est poussee. Le paquet est a televerser dans la Play Console (format Wear OS).
  wear-play:
    name: Lite Foil - Montre Android Wear OS (AAB)
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "wear-*"
          include: true
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      android_signing:
        - litefoil_keystore
      node: 20
    scripts:
      - name: Outil de build (meme Gradle que l'appli telephone)
        script: |
          npm install
          npm run build:www
          if [ ! -d "android" ]; then npx cap add android; fi
          cp android/gradlew native/wear/gradlew && chmod +x native/wear/gradlew
          mkdir -p native/wear/gradle && cp -R android/gradle/wrapper native/wear/gradle/
      - name: Numero de version
        script: |
          VC=$(date +%s)
          sed -i.bak "s/versionCode 1$/versionCode $VC/" native/wear/app/build.gradle
          echo "versionCode applique : $VC"
      - name: Build de l'appli montre (AAB release)
        script: |
          cd native/wear
          ./gradlew bundleRelease
      - name: Signer l'AAB avec la cle Lite Foil
        script: |
          AAB=native/wear/app/build/outputs/bundle/release/app-release.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$CM_KEYSTORE_PATH" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            -keypass "$CM_KEY_PASSWORD" \
            "$AAB" "$CM_KEY_ALIAS"
          cp "$AAB" "$CM_BUILD_DIR/Lite-Foil-montre.aab"
    artifacts:
      - Lite-Foil-montre.aab

  # ----------------------------------------------------------------------------
  # ANDROID NATIF (Capacitor -> Bluetooth natif du telephone), paquet .aab signe.
  # A FAIRE DANS L'INTERFACE CODEMAGIC (une seule fois) :
  #   - connecter ce depot GitHub,
  #   - "Code signing identities" > Android keystores : televerser cert/signing.keystore
  #       * reference name : litefoil_keystore
  #       * keystore password / key password : voir cert/signing-key-info.txt
  #       * key alias : litefoil
  # Le build produit un .aab signe (artefact "Lite-Foil-natif.aab") a televerser
  # a la main dans la Play Console (Production > Creer une version).
  # Plus tard, pour publier automatiquement, ajouter une integration Google Play
  # (compte de service) et un bloc publishing: google_play.
  android-play:
    name: Lite Foil - Android (Play Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      android_signing:
        - litefoil_keystore          # <- nom de reference du keystore dans Codemagic
      node: 20
      vars:
        PACKAGE_NAME: "fr.litefoil.tracker"
    scripts:
      - name: Installer les dependances
        script: npm install
      - name: Assembler le dossier www (site + pont Bluetooth)
        script: npm run build:www
      - name: Generer / synchroniser le projet Android
        script: |
          # notifications + connexion Google : modules Firebase seulement si le fichier de config Android est fourni
          if [ -f android-assets/google-services.json ]; then npm install @capacitor-firebase/messaging@6.3.1 @capacitor-firebase/authentication@6.3.1 firebase@10.12.5; fi
          if [ ! -d "android" ]; then npx cap add android; fi
          if [ -f android-assets/google-services.json ]; then
            cp android-assets/google-services.json android/app/google-services.json
            grep -q POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml || \
              perl -0pi -e 's#(<uses-permission android:name="android.permission.INTERNET" />)#$1\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' android/app/src/main/AndroidManifest.xml
          fi
          # suivi GPS écran verrouillé / téléphone en poche : localisation + service de premier plan (Android 14+)
          for P in ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION FOREGROUND_SERVICE FOREGROUND_SERVICE_LOCATION WAKE_LOCK; do
            grep -q "android.permission.$P\"" android/app/src/main/AndroidManifest.xml || \
              perl -0pi -e "s#(<uses-permission android:name=\"android.permission.INTERNET\" />)#\$1\n    <uses-permission android:name=\"android.permission.$P\" />#" android/app/src/main/AndroidManifest.xml
          done
          grep -q 'android.hardware.location.gps' android/app/src/main/AndroidManifest.xml || \
            perl -0pi -e 's#(<uses-permission android:name="android.permission.INTERNET" />)#$1\n    <uses-feature android:name="android.hardware.location.gps" />#' android/app/src/main/AndroidManifest.xml
          # module natif LfTrack : suivi GPS qui continue appli fermée (native/android, voir SUIVI_ARRIERE_PLAN.md)
          bash scripts/android-setup.sh
          npx cap sync android
      - name: Numero de version (toujours superieur a l'app actuelle)
        script: |
          VC=$(date +%s)
          sed -i.bak "s/versionCode 1/versionCode $VC/" android/app/build.gradle
          sed -i.bak 's/versionName "1.0"/versionName "1.5.1"/' android/app/build.gradle
          echo "versionCode applique : $VC"
      - name: Build de l'app (AAB release)
        script: |
          cd android
          ./gradlew bundleRelease
      - name: Signer l'AAB avec la cle Lite Foil
        script: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$CM_KEYSTORE_PATH" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            -keypass "$CM_KEY_PASSWORD" \
            "$AAB" "$CM_KEY_ALIAS"
          cp "$AAB" "$CM_BUILD_DIR/Lite-Foil-natif.aab"
    artifacts:
      - Lite-Foil-natif.aab
      - android/app/build/outputs/bundle/release/*.aab
